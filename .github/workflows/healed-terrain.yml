name: Mapping terrain integration
on: [push, pull_request]
jobs:
  python311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy<3' 'rasterio>=1.4,<1.5' terrio==0.5.0 'scipy>=1.11'
      # Authorized companion installs exercise the direct builder tests as well.
      # Public CI does not fetch a private repository or receive its credentials.
      - run: python -m pytest
