name: Optional mapping engine

on:
  pull_request:
    paths:
      - 'rust/step05/**'
      - 'src/*05.py'
      - 'src/ras2fim-2d.py'
      - 'src/rust_mapping.py'
      - 'src/mapping_aoi.py'
      - 'tests/test_mapping_aoi.py'
      - 'tests/test_rust_mapping.py'
      - 'tests/test_mapping_run_safety.py'
      - 'tests/test_benchmark_mapping.py'
      - 'benchmarks/**'
      - 'pyproject.toml'
      - '.github/workflows/optional-mapping.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-interface:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: mapping-tests
          create-args: >-
            python=3.13 pip gdal rasterio=1.4.4 scipy=1.16.3
            numpy=2.3.5 pandas=2.3.3 geopandas=1.1.1 h5py matplotlib
            pyproj=3.7.2 shapely=2.1.2 pytest rioxarray netcdf4 h5netcdf networkx tqdm
          cache-environment: true
      - name: Install Windows COM dependency
        if: runner.os == 'Windows'
        shell: bash -el {0}
        run: python -m pip install pywin32
      - name: Test optional dispatch and spatial constraints
        shell: bash -el {0}
        run: python -m pytest tests/test_mapping_aoi.py tests/test_rust_mapping.py tests/test_mapping_run_safety.py tests/test_benchmark_mapping.py -q

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.99.1 fmt --manifest-path rust/step05/Cargo.toml -- --check
      - name: Lint
        run: cargo +1.99.1 clippy --locked --manifest-path rust/step05/Cargo.toml --all-targets -- -D warnings
      - name: Test fixture-free Rust behavior
        run: cargo +1.99.1 test --locked --manifest-path rust/step05/Cargo.toml --all-targets
